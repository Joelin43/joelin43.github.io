baseURL = 'https://joelin43.github.io'
languageCode = 'es'
title = 'Joel Rovira | IT & Cybersecurity'
theme = "minimal-black"

# Enable search index generation and web app manifest
[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[params]
  brand = "Joel Rovira"
  description = "Estudiante de ASIR aprendiendo ciberseguridad"

  # Favicon - Place your favicon files in /static/ directory
  # Supported formats: .ico, .png, .svg
  favicon = "icons/favicon.ico"
  appleTouchIcon = "apple-touch-icon.png"

  # Logo (optional)
  logo = "images/logo.png"

  # Project and blog intro text
  projectsIntro = "Selected projects to display list." # Can be empty
  blogIntro = "" # Can be empty
  
  customCSS = ["css/custom.css"]
  
  # Web App Manifest Configuration (PWA support)
  [params.manifest]
    themeColor = "#e82525"
    backgroundColor = "#000000"
    categories = ["blog", "portfolio", "developer"]

    # Custom icon configuration (optional)
    # If not specified, defaults to /icons/android-chrome-*.png
    # [[params.manifest.icons]]
    #   src = "/icons/android-chrome-192x192.png"
    #   sizes = "192x192"
    #   type = "image/png"
    #   purpose = "any maskable"

  # Theme Configuration
  [params.theme]
    defaultTheme = "dark"  # Options: "light", "dark", "system"

  # Home Page Configuration
  [params.home]
    sections = ["hero", "now", "tech-marquee", "projects"]#, "posts"]
    showNowSection = true
    showFeaturedProjects = true
    showLatestPosts = true
    featuredProjectsLimit = 3
    latestPostsLimit = 3
    projectsTitle = "Selected Work"
    projectsSubtitle = ""
    blogTitle = "Latest Writing"
    blogSubtitle = ""
    techMarqueeLabel = "Experienced In"

    # Technology Stack Display
  [[params.home.tech]]
      label = "Linux"
      icon = "devicon-linux-plain"

    [[params.home.tech]]
      label = "Docker"
      icon = "devicon-docker-plain"

    [[params.home.tech]]
      label = "Git"
      icon = "devicon-git-plain"
    
    [[params.home.tech]]
      label = "Debian"
      icon = "devicon-debian-plain"
    
    [[params.home.tech]]
      label = "Arch"
      icon = "devicon-archlinux-plain"
    
    [[params.home.tech]]
      label = "GitHub"
      icon = "devicon-github-original"

    [[params.home.techReverse]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.home.techReverse]]
      label = "Bash"
      icon = "devicon-bash-plain"

    [[params.home.techReverse]]
      label = "Markdown"
      icon = "devicon-markdown-original"

    [[params.home.techReverse]]
      label = "HTML"
      icon = "devicon-html5-plain"   
            
    [[params.home.techReverse]]
      label = "CSS"
      icon = "devicon-css3-plain"  

  # About Page Alternative Layout Configuration - Optional
  [params.about.alt]
    # Stats displayed in the profile card sidebar
    [[params.about.alt.stats]]
      value = "ASIR"
      label = "Studies"
    
    [[params.about.alt.stats]]
      value = "Linux"
      label = "Daily Environment"
    
    [[params.about.alt.stats]]
      value = "Cyber"
      label = "Main Interest"

    # Skills/Tech Stack badges with icons
    [[params.about.alt.skills]]
      label = "JavaScript"
      icon = "devicon-javascript-plain"

    [[params.about.alt.skills]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.about.alt.skills]]
      label = "Docker"
      icon = "devicon-docker-plain"

  # Hero Section Configuration
  [params.hero]
    badge = "ASIR Student"
    title = "Hey, I'm Joel Rovira"
    role = "IT & Cybersecurity Student"
    summary = "A simple page to present myself and some projects"
    avatar = "images/avatar.png"  # Optional: 400x400px recommended
    location = "Barcelona, España"
    focus = "Currently focused on cybersecurity, Linux and networking."
    available = true
    availableLabel = "Available for work"

    nowLabel = "Quick Facts"
    nowIntro = "Right now I'm mainly:"
    now = [
      "Learning cybersecurity and pentesting",
      "Building personal projects and labs",
      "Improving my Linux and networking skills"
    ]

    [params.hero.primary]
      label = "View Projects"
      href = "/projects/"

    [params.hero.secondary]
      label = "Read the WriteUps"
      href = "/writeups/"

  # Icon Libraries
  [params.icons]
    useFontAwesome = true
    useDevicon = true

  # Social Links
  [[params.social]]
    label = "GitHub"
    url = "https://github.com/Joelin43"
    icon = "fa-brands fa-github"

  [[params.social]]
    label = "LinkedIn"
    url = "https://www.linkedin.com/in/joel-rovira-luque/"
    icon = "fa-brands fa-linkedin-in"

  [[params.social]]
    label = "Email"
    url = "mailto:joelrovira20@gmail.com"
    icon = "fa-regular fa-envelope"

# Navigation Menu
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    url = "/"
    weight = 1
    identifier = "home"
    [menu.main.params]
      icon = "fa-solid fa-house"

  [[menu.main]]
    name = "About"
    pageRef = "about"
    url = "/About/"
    weight = 2
    identifier = "about"
    [menu.main.params]
      icon = "fa-regular fa-user"

  [[menu.main]]
    name = "Projects"
    pageRef = "projects"
    url = "/projects/"
    weight = 3
    identifier = "projects"
    [menu.main.params]
      icon = "fa-regular fa-folder-open"

  [[menu.main]]
    name = "Write Up's"
    pageRef = "WriteUps"
    url = "/WriteUps/"
    weight = 4
    identifier = "writeups"
    [menu.main.params]
      icon = "fa-solid fa-flask"

  #[[menu.main]]
  #  name = "Blog"
  #  pageRef = "blog"
  #  url = "/blog/"
  #  weight = 4
  #  identifier = "blog"
  #  [menu.main.params]
  #    icon = "fa-regular fa-note-sticky"



# Markup Configuration
[markup]
  # Table of Contents
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  # Goldmark Renderer (Markdown)
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

  [markup.goldmark.extensions]
    typographer = true
    linkify = true
    table = true
    strikethrough = true
    taskList = true
    definitionList = true
    footnote = true

    [markup.goldmark.extensions.extras.delete]
      enable = true
    [markup.goldmark.extensions.extras.insert]
      enable = true
    [markup.goldmark.extensions.extras.mark]
      enable = true

  # Syntax Highlighting
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Privacy Configuration
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
